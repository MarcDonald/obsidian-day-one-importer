name: Check Commit

on:
  workflow_dispatch:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - main

jobs:
  check-commit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.x'

      - name: Run checks
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
